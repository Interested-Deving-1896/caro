[package]
name = "caro-tui-demo"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI demo for Caro powered by Ratzilla"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ratzilla = { version = "0.2" }
# No crossterm feature - ratzilla uses Canvas backend for WASM
ratatui = { version = "0.29", default-features = false, features = ["all-widgets"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
